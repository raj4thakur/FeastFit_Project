[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = ["B008", "E501"]  # B008: FastAPI Depends()/Query() defaults are idiomatic

[tool.coverage.run]
source = ["app"]
