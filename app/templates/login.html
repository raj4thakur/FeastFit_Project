{% extends "base.html" %}
{% block title %}Log in · {{ app_name }}{% endblock %}
{% block page %}login{% endblock %}
{% block content %}
<section class="container auth">
  <div class="panel">
    <h1>Bentornato</h1>
    <p class="muted">Log in to save favourites and share your recipes.</p>
    <form id="login-form" class="form">
      <label>Username or email<input name="username" autocomplete="username" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit">Log in</button>
    </form>
    <p class="small">New here? <a href="/register">Create an account</a></p>
  </div>
</section>
{% endblock %}
